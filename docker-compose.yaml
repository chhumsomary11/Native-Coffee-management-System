name: coffee-management

services:
  register:
    image: coffee-register:1.0
    pull_policy: never
    container_name: coffee-register
    init: true
    restart: on-failure
    env_file:
      - ./register/.env
    environment:
      PORT: "3001"
      STAFF_SERVICE_URL: http://staff:3007
    ports:
      - "3001:3001"
    networks:
      - coffee-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  login:
    image: coffee-login:1.0
    pull_policy: never
    container_name: coffee-login
    init: true
    restart: on-failure
    env_file:
      - ./login/.env
    environment:
      PORT: "3002"
    ports:
      - "3002:3002"
    networks:
      - coffee-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  menu:
    image: coffee-menu:1.0
    pull_policy: never
    container_name: coffee-menu
    init: true
    restart: on-failure
    env_file:
      - ./menu/.env
    environment:
      PORT: "3003"
    ports:
      - "3003:3003"
    networks:
      - coffee-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  inventory:
    image: coffee-inventory:1.0
    pull_policy: never
    container_name: coffee-inventory
    init: true
    restart: on-failure
    env_file:
      - ./inventory/.env
    environment:
      PORT: "3004"
    ports:
      - "3004:3004"
    networks:
      - coffee-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3004/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  order-a:
    image: coffee-order:1.0
    pull_policy: never
    container_name: coffee-order-a
    init: true
    restart: on-failure
    env_file:
      - ./order/.env
    environment:
      PORT: "3005"
      INSTANCE_ID: order-A
      MENU_SERVICE_URL: http://menu:3003
      INVENTORY_SERVICE_URL: http://inventory:3004
    ports:
      - "3005:3005"
    networks:
      - coffee-network
    depends_on:
      menu:
        condition: service_healthy
      inventory:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3005/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  order-b:
    image: coffee-order:1.0
    pull_policy: never
    container_name: coffee-order-b
    init: true
    restart: on-failure
    env_file:
      - ./order/.env
    environment:
      PORT: "3005"
      INSTANCE_ID: order-B
      MENU_SERVICE_URL: http://menu:3003
      INVENTORY_SERVICE_URL: http://inventory:3004
    ports:
      - "3015:3005"
    networks:
      - coffee-network
    depends_on:
      menu:
        condition: service_healthy
      inventory:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3005/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: coffee-nginx:1.0
    pull_policy: never
    container_name: coffee-nginx
    init: true
    restart: on-failure
    environment:
      ORDER_A_HOST: order-a
      ORDER_A_PORT: "3005"
      ORDER_B_HOST: order-b
      ORDER_B_PORT: "3005"
    ports:
      - "80:80"
    networks:
      - coffee-network
    depends_on:
      order-a:
        condition: service_healthy
      order-b:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  payment:
    image: coffee-payment:1.0
    pull_policy: never
    container_name: coffee-payment
    init: true
    restart: on-failure
    env_file:
      - ./payment/.env
    environment:
      PORT: "3006"
      ORDER_SERVICE_URL: http://nginx:8081
    ports:
      - "3006:3006"
    networks:
      - coffee-network
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3006/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  staff:
    image: coffee-staff:1.0
    pull_policy: never
    container_name: coffee-staff
    init: true
    restart: on-failure
    env_file:
      - ./staff/.env
    environment:
      PORT: "3007"
      REGISTRATION_SERVICE_URL: http://register:3001
    ports:
      - "3007:3007"
    networks:
      - coffee-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3007/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  report:
    image: coffee-report:1.0
    pull_policy: never
    container_name: coffee-report
    init: true
    restart: on-failure
    env_file:
      - ./report/.env
    environment:
      PORT: "3008"
      ORDER_SERVICE_URL: http://nginx:8081
    ports:
      - "3008:3008"
    networks:
      - coffee-network
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3008/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway:
    image: coffee-gateway:1.0
    pull_policy: never
    container_name: coffee-api-gateway
    init: true
    restart: on-failure
    env_file:
      - ./api-gateway/.env
    environment:
      PORT: "4000"
      REGISTRATION_SERVICE_URL: http://register:3001
      LOGIN_SERVICE_URL: http://login:3002
      MENU_SERVICE_URL: http://menu:3003
      INVENTORY_SERVICE_URL: http://inventory:3004
      ORDER_SERVICE_URL: http://nginx:8081
      PAYMENT_SERVICE_URL: http://payment:3006
      STAFF_SERVICE_URL: http://staff:3007
      REPORT_SERVICE_URL: http://report:3008
    ports:
      - "4000:4000"
    networks:
      - coffee-network
    depends_on:
      register:
        condition: service_healthy
      login:
        condition: service_healthy
      menu:
        condition: service_healthy
      inventory:
        condition: service_healthy
      order-a:
        condition: service_healthy
      order-b:
        condition: service_healthy
      nginx:
        condition: service_healthy
      payment:
        condition: service_healthy
      staff:
        condition: service_healthy
      report:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  coffee-network:
    name: coffee-network
    driver: bridge
