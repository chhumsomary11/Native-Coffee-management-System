name: coffee-management

# One file for every machine. Which services run is chosen by COMPOSE_PROFILES
# (edge | ec2-2 | ec2-3 | all) and where they find each other by the *_HOST
# variables. Every variable has a default that matches single-machine Docker
# networking, so local use needs no root .env: `docker compose --profile all up -d`.
# See .env.example for the EC2 values.

x-service: &service
  init: true
  restart: on-failure
  pull_policy: ${PULL_POLICY:-never}
  networks:
    - coffee-network

# Every app service listens on $PORT, so one healthcheck fits all of them.
x-healthcheck: &health
  test:
    [
      "CMD",
      "node",
      "-e",
      "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
    ]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  register:
    <<: *service
    image: ${IMAGE_PREFIX:-}coffee-register:1.0
    container_name: coffee-register
    profiles: [edge, all]
    env_file:
      - ./.env
    environment:
      PORT: "3001"
      URI: ${URI_AUTH}
      STAFF_SERVICE_URL: http://${STAFF_HOST:-staff}:3007
    ports:
      - "3001:3001"
    healthcheck: *health

  login:
    <<: *service
    image: ${IMAGE_PREFIX:-}coffee-login:1.0
    container_name: coffee-login
    profiles: [edge, all]
    env_file:
      - ./.env
    environment:
      PORT: "3002"
      URI: ${URI_AUTH}
    ports:
      - "3002:3002"
    healthcheck: *health

  menu:
    <<: *service
    image: ${IMAGE_PREFIX:-}coffee-menu:1.0
    container_name: coffee-menu
    profiles: [ec2-2, all]
    env_file:
      - ./.env
    environment:
      PORT: "3003"
      URI: ${URI_MENU}
    ports:
      - "3003:3003"
    healthcheck: *health

  inventory:
    <<: *service
    image: ${IMAGE_PREFIX:-}coffee-inventory:1.0
    container_name: coffee-inventory
    profiles: [ec2-2, all]
    env_file:
      - ./.env
    environment:
      PORT: "3004"
      URI: ${URI_INVENTORY}
    ports:
      - "3004:3004"
    healthcheck: *health

  order-a:
    <<: *service
    image: ${IMAGE_PREFIX:-}coffee-order:1.0
    container_name: coffee-order-a
    profiles: [ec2-2, all]
    env_file:
      - ./.env
    environment:
      PORT: "3005"
      URI: ${URI_ORDER}
      INSTANCE_ID: order-A
      MENU_SERVICE_URL: http://${MENU_HOST:-menu}:3003
      INVENTORY_SERVICE_URL: http://${INVENTORY_HOST:-inventory}:3004
    ports:
      - "3005:3005"
    healthcheck: *health

  order-b:
    <<: *service
    image: ${IMAGE_PREFIX:-}coffee-order:1.0
    container_name: coffee-order-b
    profiles: [ec2-3, all]
    env_file:
      - ./.env
    environment:
      PORT: "3005"
      URI: ${URI_ORDER}
      INSTANCE_ID: order-B
      MENU_SERVICE_URL: http://${MENU_HOST:-menu}:3003
      INVENTORY_SERVICE_URL: http://${INVENTORY_HOST:-inventory}:3004
    ports:
      - "3015:3005"
    healthcheck: *health

  nginx:
    <<: *service
    image: ${IMAGE_PREFIX:-}coffee-nginx:1.0
    container_name: coffee-nginx
    profiles: [edge, all]
    environment:
      ORDER_A_HOST: ${ORDER_A_HOST:-order-a}
      ORDER_A_PORT: ${ORDER_A_PORT:-3005}
      ORDER_B_HOST: ${ORDER_B_HOST:-order-b}
      ORDER_B_PORT: ${ORDER_B_PORT:-3005}
    ports:
      - "80:80"
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  payment:
    <<: *service
    image: ${IMAGE_PREFIX:-}coffee-payment:1.0
    container_name: coffee-payment
    profiles: [ec2-2, all]
    env_file:
      - ./.env
    environment:
      PORT: "3006"
      URI: ${URI_PAYMENT}
      ORDER_SERVICE_URL: http://${NGINX_HOST:-nginx}:8081
    ports:
      - "3006:3006"
    healthcheck: *health

  staff:
    <<: *service
    image: ${IMAGE_PREFIX:-}coffee-staff:1.0
    container_name: coffee-staff
    profiles: [ec2-3, all]
    env_file:
      - ./.env
    environment:
      PORT: "3007"
      URI: ${URI_STAFF}
      REGISTRATION_SERVICE_URL: http://${REGISTER_HOST:-register}:3001
    ports:
      - "3007:3007"
    healthcheck: *health

  report:
    <<: *service
    image: ${IMAGE_PREFIX:-}coffee-report:1.0
    container_name: coffee-report
    profiles: [ec2-3, all]
    env_file:
      - ./.env
    environment:
      PORT: "3008"
      ORDER_SERVICE_URL: http://${NGINX_HOST:-nginx}:8081
    ports:
      - "3008:3008"
    healthcheck: *health

  api-gateway:
    <<: *service
    image: ${IMAGE_PREFIX:-}coffee-gateway:1.0
    container_name: coffee-api-gateway
    profiles: [edge, all]
    env_file:
      - ./.env
    environment:
      PORT: "4000"
      REGISTRATION_SERVICE_URL: http://${REGISTER_HOST:-register}:3001
      LOGIN_SERVICE_URL: http://${LOGIN_HOST:-login}:3002
      MENU_SERVICE_URL: http://${MENU_HOST:-menu}:3003
      INVENTORY_SERVICE_URL: http://${INVENTORY_HOST:-inventory}:3004
      ORDER_SERVICE_URL: http://${NGINX_HOST:-nginx}:8081
      PAYMENT_SERVICE_URL: http://${PAYMENT_HOST:-payment}:3006
      STAFF_SERVICE_URL: http://${STAFF_HOST:-staff}:3007
      REPORT_SERVICE_URL: http://${REPORT_HOST:-report}:3008
    ports:
      - "4000:4000"
    healthcheck: *health

networks:
  coffee-network:
    name: coffee-network
    driver: bridge
