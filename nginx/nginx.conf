# This file is processed as an Nginx template by the Docker image.
# Two jobs:
#   1. Public port 80  -> forwards ALL client/Postman traffic to the API Gateway
#                         so every API call still passes through the gateway.
#   2. Internal port 8081 -> load balances Order requests across two instances.
#                            Gateway, Payment, and Report use this endpoint.


upstream order_cluster {
    server ${ORDER_A_HOST}:${ORDER_A_PORT};
    server ${ORDER_B_HOST}:${ORDER_B_PORT};
}

server {
    listen 80;

    # The Gateway starts after Nginx becomes healthy. Docker's DNS resolver and
    # a variable-based proxy target defer lookup until a request arrives.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_gateway_url http://api-gateway:4000;

    location / {
        proxy_pass $api_gateway_url;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 8081;

    location / {
        proxy_pass http://order_cluster;
        add_header X-Upstream $upstream_addr always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
